          ['Wastewater, unpolluted', 'market for wastewater, unpolluted', '-0.001278 m3', 'operation'], ['Methanol-to-olefins installation', 'methanol-to-olefins installation', '3.584e-12 unit/kg', 'installation'],
        ],

          ['Electricity, medium voltage, DE', 'market for electricity, medium voltage', '74.878 + 0.6663 = 75.5443 kWh', 'operation'], ['Deionised water, Europe', 'market for water, deionised', '4.4249 kg', 'operation'],
          ['Cooling energy', 'market for cooling energy', '5.0883 MJ', 'operation'], ['Industrial heat, natural gas', 'market for heat, district or industrial, natural gas', '31.5666 MJ', 'operation'],
          ['Cooling at -15 C', 'market for cooling energy, at -15 C', '0.1791 MJ', 'operation'], ['Cooling at -25 C', 'cooling energy production, at -25 C, propylene compression refrigeration system 1 MW', '0.0578 MJ', 'operation'],
          ['Cooling at -45 C', 'market for cooling energy, at -45 C', '0.1156 MJ', 'operation'], ['Cooling at -55 C', 'market for cooling energy, at -55 C', '0.0578 MJ', 'operation'],

          ['CO2 from by-product oxidation (eol=no)', 'Carbon dioxide, fossil (air)', '6.091081 kg', 'biosphere'],
          ['eCO2R system installation', 'eCO2R system installation', '4e-10 unit/kg', 'installation'],

      function element(name, attrs = {}, text = '') {
        const item = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) =&gt; item.setAttribute(key, value));
        if (text) item.textContent = text;
        return item;
      }

      function isVisibleProcess(id) {
        return route === 'all' || processes[id].route === route;
      }

      function point(id) {
        return processes[id] || products[id];
      }

      function addEdge(from, to, label, className = '') {
        const start = point(from);
        const end = point(to);
        const line = element('line', { x1: start.x + 55, y1: start.y, x2: end.x - 55, y2: end.y, class: `edge ${className}`.trim() });
        svg.append(line);
        if (label) {
          const text = element('text', { x: (start.x + end.x) / 2, y: (start.y + end.y) / 2 - 8, class: 'edge-label', 'text-anchor': 'middle' }, label);
          svg.append(text);
        }
      }

      function addNode(id, item, type, label = item.label, selectedNode = false) {
        const group = element('g', { class: `node ${type}${selectedNode ? ' selected' : ''}`, 'data-node': id });
        if (type === 'product') {
          group.append(element('ellipse', { cx: item.x, cy: item.y, rx: 70, ry: 26 }));
        } else {
          group.append(element('rect', { x: item.x - 68, y: item.y - 25, width: 136, height: 50, rx: 8 }));
        }
        const words = label.split(' ');
        const first = words.length &gt; 2 ? words.slice(0, Math.ceil(words.length / 2)).join(' ') : label;
        const second = words.length &gt; 2 ? words.slice(Math.ceil(words.length / 2)).join(' ') : '';
        group.append(element('text', { x: item.x, y: item.y - (second ? 5 : 0), 'text-anchor': 'middle' }, first));
        if (second) group.append(element('text', { x: item.x, y: item.y + 12, 'text-anchor': 'middle' }, second));
        group.addEventListener('click', () =&gt; {
          if (processes[id]) {
            selected = id;
            select.value = id;
            render();
          }
        });
        svg.append(group);
      }

      function addFocusedFlow(flow, index, total) {
        const process = processes[selected];
        const columns = total &gt; 9 ? 2 : 1;
        const rows = Math.ceil(total / columns);
        const column = Math.floor(index / rows);
        const row = index % rows;
        const x = columns === 2 ? 92 + column * 170 : 175;
        const y = 50 + row * 58;
        const type = flow[3];
        const item = { x, y, label: flow[0] };
        const edgeClass = type === 'installation' ? 'installation' : type === 'biosphere' ? 'biosphere' : 'selected';
        const line = element('line', { x1: x + 60, y1: y, x2: process.x - 74, y2: process.y, class: `edge ${edgeClass}` });
        svg.append(line);
        const node = element('g', { class: `node ${type === 'operation' ? 'background' : type}`, 'data-flow': flow[1] });
        node.append(element('rect', { x: x - 62, y: y - 20, width: 124, height: 40, rx: 7 }));
        node.append(element('text', { x, y: y - 2, 'text-anchor': 'middle' }, flow[0].length &gt; 22 ? `${flow[0].slice(0, 20)}...` : flow[0]));
        node.append(element('text', { x, y: y + 13, 'text-anchor': 'middle', class: 'edge-label' }, flow[2]));
        svg.append(node);
      }

      function addDefinitions() {
        svg.append(element('title', { id: 'system-map-title' }, 'Ethylene case study product and process system'));
        svg.append(element('desc', { id: 'system-map-description' }, 'Select a route or process to inspect direct operating inputs, installation flows, and biosphere flows.'));
        const defs = element('defs');
        const marker = element('marker', { id: 'system-map-arrow', viewBox: '0 0 10 10', refX: '8', refY: '5', markerWidth: '5', markerHeight: '5', orient: 'auto-start-reverse' });
        marker.append(element('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--border)' }));
        defs.append(marker);
        svg.append(defs);
      }

      function renderDetail() {
        if (!selected) {
          detail.innerHTML = '&lt;p class=&quot;detail-empty&quot;&gt;Select a foreground process to inspect its direct operating inputs, installation flows, and biosphere flows.&lt;/p&gt;';
          return;
        }
        const processFlows = flows[selected];
        const rows = processFlows.map(([short, full, amount, type]) =&gt; `&lt;tr&gt;&lt;td&gt;${short}&lt;/td&gt;&lt;td&gt;&lt;code&gt;${full}&lt;/code&gt;&lt;/td&gt;&lt;td class=&quot;text-end text-nowrap&quot;&gt;${amount}&lt;/td&gt;&lt;td class=&quot;flow-type&quot;&gt;${type === 'operation' ? 'operation=True' : type === 'installation' ? 'operation=False' : 'biosphere'}&lt;/td&gt;&lt;/tr&gt;`).join('');
        detail.innerHTML = `&lt;p class=&quot;detail-title&quot;&gt;${processes[selected].label}: direct non-foreground exchanges&lt;/p&gt;&lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Input or flow&lt;/th&gt;&lt;th&gt;Brightway node&lt;/th&gt;&lt;th class=&quot;text-end&quot;&gt;Amount&lt;/th&gt;&lt;th&gt;Type&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;${rows}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;`;
      }

      function render() {
        svg.replaceChildren();
        addDefinitions();
        foregroundEdges.forEach(([from, to, label]) =&gt; {
          const sourceVisible = processes[from] ? isVisibleProcess(from) : true;
          const targetVisible = processes[to] ? isVisibleProcess(to) : true;
          if (sourceVisible &amp;&amp; targetVisible) addEdge(from, to, label, selected &amp;&amp; (from === selected || to === selected) ? 'selected' : '');
        });
        Object.entries(products).forEach(([id, item]) =&gt; {
          const connected = foregroundEdges.some(([from, to]) =&gt; (from === id &amp;&amp; (!processes[to] || isVisibleProcess(to))) || (to === id &amp;&amp; (!processes[from] || isVisibleProcess(from))));
          if (connected) addNode(id, item, 'product');
        });
        Object.entries(processes).forEach(([id, item]) =&gt; {
          if (isVisibleProcess(id)) addNode(id, item, 'process', item.label, selected === id);
        });

        if (selected &amp;&amp; isVisibleProcess(selected)) {
          const visibleFlows = flows[selected].filter((flow) =&gt; layerInputs[flow[3]].checked);
          visibleFlows.forEach((flow, index) =&gt; addFocusedFlow(flow, index, visibleFlows.length));
        }
        renderDetail();
      }

      root.querySelectorAll('[data-route]').forEach((button) =&gt; {
        button.addEventListener('click', () =&gt; {
          route = button.dataset.route;
          root.querySelectorAll('[data-route]').forEach((item) =&gt; {
            const active = item === button;
            item.setAttribute('aria-pressed', String(active));
            item.classList.toggle('btn-primary', active);
          });
          if (selected &amp;&amp; !isVisibleProcess(selected)) {
            selected = '';
            select.value = '';
          }
          render();
        });
      });
      select.addEventListener('change', () =&gt; {
        selected = select.value;
        if (selected &amp;&amp; !isVisibleProcess(selected)) {
          route = processes[selected].route;
          root.querySelectorAll('[data-route]').forEach((item) =&gt; {
            const active = item.dataset.route === route;
            item.setAttribute('aria-pressed', String(active));
            item.classList.toggle('btn-primary', active);
          });
        }
        render();
      });
      Object.values(layerInputs).forEach((input) =&gt; input.addEventListener('change', render));
      render();
    })();
  &lt;/script&gt;

  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

  });
  renderList();
  load();
})();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
